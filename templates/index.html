<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft - AI Comic Story Creator</title>
</head>

<body>

    <h1>🎨 ComicCraft</h1>
    <h2>AI Comic Story Creator using Gemini</h2>

    <form action="/generate" method="post">

        <label>Enter your story idea:</label>
        <br><br>

        <input
            type="text"
            name="prompt"
            placeholder="Example: A superhero saves the city"
            required
        >

        <br><br>

        <button type="submit">✨ Generate Comic</button>

    </form>

    <hr>

    {% if result %}

        <h2>📖 {{ result.title }}</h2>

        <p>{{ result.story }}</p>

        <h3>🎬 Comic Scenes</h3>

        {% for scene in result.scenes %}
            <p>🖼️ {{ scene }}</p>
        {% endfor %}

    {% else %}

        <h2>Your Comic Story</h2>
        <p>Enter a story idea above and click Generate Comic.</p>

    {% endif %}

</body>
</html>
